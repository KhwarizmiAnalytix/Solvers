# coverage-tool configuration for Solvers.
#
# Solvers is a single flat CMake target (not XSigma's Library/<Module> tree), so
# the module list is given explicitly and the test-layout templates are pointed
# at this repo's names: the suite is SolversTests under Testing/Cxx, and its
# shared library libSolvers is emitted to <build>/lib when coverage is on.

[coverage]
modules = ["Solvers"]
# Source lives at the repo root (src/ + include/), not under a Library/ folder.
filter = "."
source_folder = "."

[coverage.exclude]
patterns = ["*ThirdParty*", "*Testing*", "/usr/*"]
llvm_ignore_regex = [".*Testing[/\\\\].*", ".*ThirdParty[/\\\\].*"]

[coverage.tests]
# Executable is SolversTests (not the default {module}CxxTests); it runs from
# Testing/Cxx. Discovery still prefers the CTest "Solvers" label when present.
exe_pattern = "{module}Tests"
profraw_pattern = "{module}Tests.profraw"
test_dir_template = "Testing/Cxx"
