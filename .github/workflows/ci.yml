name: Solvers CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: config.build.test
          - name: shared
            args: config.build.test.shared
          - name: sanitizer
            args: config.build.test.sanitizer
          - name: coverage
            args: config.build.test.coverage
          - name: ceres
            args: config.build.test.ceres
          - name: nlopt
            args: config.build.test.nlopt
          - name: ceres-nlopt
            args: config.build.test.ceres.nlopt
          - name: ceres-nlopt-benchmark
            args: config.build.test.ceres.nlopt.benchmark
          - name: gcc
            args: config.build.test.gcc
          - name: clangtidy
            args: config.build.clangtidy

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install clang-tidy
        if: matrix.name == 'clangtidy'
        run: sudo apt-get update && sudo apt-get install --yes clang-tidy

      - name: Configure, build, and test
        working-directory: Scripts
        run: python3 setup.py ${{ matrix.args }} --build-dir build-${{ matrix.name }}
