name: Solvers CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ===========================================================================
  # UBUNTU TESTS
  # ===========================================================================
  ubuntu-tests:
    name: Ubuntu - ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Core builds
          - name: default (Debug)
            args: config.build.test.debug

          - name: static (Debug)
            args: config.build.test.static.debug

          - name: default (Release)
            args: config.build.test.release

          - name: shared (Debug)
            args: config.build.test.shared.debug

          # Compiler variants
          - name: GCC (Debug)
            args: config.build.test.gcc.debug
            env_cc: gcc
            env_cxx: g++

          - name: Clang (Debug)
            args: config.build.test.clang.debug
            env_cc: clang
            env_cxx: clang++

          # Backend variants
          - name: Ceres backend
            args: config.build.test.ceres

          - name: Ipopt backend
            args: config.build.test.ipopt

          - name: PETSc backend
            args: config.build.test.petsc

          # Multi-backend
          - name: Ceres + Ipopt
            args: config.build.test.ceres.ipopt

          - name: Ceres + PETSc
            args: config.build.test.ceres.petsc

          # Analysis
          - name: Sanitizer (UBSan + ASan)
            args: config.build.test.sanitizer

          - name: Coverage
            args: config.build.test.coverage

          - name: Clang-Tidy
            args: config.build.clangtidy

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            pkg-config \
            gfortran \
            liblapack-dev \
            libblas-dev \
            mold

      - name: Install Clang (for Clang variant)
        if: matrix.env_cc == 'clang'
        run: sudo apt-get install --yes clang

      - name: Install clang-tidy
        if: matrix.name == 'Clang-Tidy'
        run: sudo apt-get install --yes clang-tidy

      - name: Install coverage-tool
        if: matrix.name == 'Coverage'
        run: pip install coverage-tool

      - name: Install Ipopt
        if: contains(matrix.args, 'ipopt')
        run: sudo apt-get install --yes coinor-libipopt-dev

      - name: Install PETSc
        if: contains(matrix.args, 'petsc')
        run: sudo apt-get install --yes petsc-dev libopenmpi-dev

      - name: Configure, build, and test
        working-directory: Scripts
        env:
          CC: ${{ matrix.env_cc || '' }}
          CXX: ${{ matrix.env_cxx || '' }}
        run: python3 setup.py ${{ matrix.args }}

      - name: Upload coverage to Codecov
        if: matrix.name == 'Coverage'
        uses: codecov/codecov-action@v4
        with:
          files: build_ninja/coverage_report/coverage.lcov
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ===========================================================================
  # macOS TESTS
  # ===========================================================================
  macos-tests:
    name: macOS - ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 15 (Apple Silicon / ARM64)
          - name: default (Debug)
            os: macos-15
            args: config.build.test.debug

          - name: static (Debug)
            os: macos-15
            args: config.build.test.static.debug

          - name: shared (Debug)
            os: macos-15
            args: config.build.test.shared.debug

          - name: Ceres backend
            os: macos-15
            args: config.build.test.ceres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install system dependencies
        run: |
          brew update
          brew install pkg-config openblas lapack

      - name: Install Ceres dependencies
        if: contains(matrix.args, 'ceres')
        run: |
          brew install glog gflags

      - name: Configure, build, and test
        working-directory: Scripts
        run: python3 setup.py ${{ matrix.args }}

  # ===========================================================================
  # WINDOWS TESTS
  # ===========================================================================
  windows-tests:
    name: Windows - ${{ matrix.name }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          # Core builds
          - name: default (Debug)
            args: config.build.test.debug

          - name: static (Debug)
            args: config.build.test.static.debug

          - name: default (Release)
            args: config.build.test.release

          - name: shared (Debug)
            args: config.build.test.shared.debug

          # Backend variant
          - name: Ceres backend
            args: config.build.test.ceres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Configure, build, and test
        working-directory: Scripts
        shell: bash
        run: python3 setup.py ${{ matrix.args }}

  # ===========================================================================
  # COMPILER CACHE & ICECC
  # ===========================================================================
  cache-icecc:
    name: Cache & Icecc - ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux ccache
            os: ubuntu-24.04
            cmake_args: --cache=ON --cache-backend=ccache

          - name: Linux sccache
            os: ubuntu-24.04
            backend: sccache
            cmake_args: --cache=ON --cache-backend=sccache

          - name: Linux icecc
            os: ubuntu-24.04
            cmake_args: --icecc=ON

          - name: macOS ccache
            os: macos-15
            cmake_args: --cache=ON --cache-backend=ccache

          - name: macOS sccache
            os: macos-15
            backend: sccache
            cmake_args: --cache=ON --cache-backend=sccache

          - name: macOS icecc
            os: macos-15
            cmake_args: --icecc=ON

          - name: Windows ccache
            os: windows-2022
            cmake_args: --cache=ON --cache-backend=ccache

          - name: Windows sccache
            os: windows-2022
            backend: sccache
            cmake_args: --cache=ON --cache-backend=sccache

          - name: Linux buildcache
            os: ubuntu-24.04
            backend: buildcache
            cmake_args: --cache=ON --cache-backend=buildcache

          - name: macOS buildcache
            os: macos-15
            backend: buildcache
            cmake_args: --cache=ON --cache-backend=buildcache

          - name: Windows buildcache
            os: windows-2022
            backend: buildcache
            cmake_args: --cache=ON --cache-backend=buildcache

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install Ninja and ccache/icecc (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build pkg-config gfortran liblapack-dev libblas-dev ccache icecc

      - name: Install Ninja and ccache/icecream (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_UPGRADE: 1
        run: brew install ninja pkg-config openblas lapack ccache icecream

      - name: Install Ninja and ccache (Windows)
        if: runner.os == 'Windows'
        run: choco install -y ninja ccache

      - name: Set up sccache
        if: matrix.backend == 'sccache'
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Set BuildCache directory
        if: matrix.backend == 'buildcache'
        shell: bash
        run: echo "BUILDCACHE_DIR=$RUNNER_TEMP/buildcache-data" >> "$GITHUB_ENV"

      - name: Install BuildCache
        if: matrix.backend == 'buildcache'
        shell: bash
        run: python3 .github/scripts/install_buildcache.py --prefix "$RUNNER_TEMP/buildcache-tool"

      - name: Configure
        shell: bash
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja
          --build-type=Release
          --testing=ON
          ${{ matrix.cmake_args }}

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build

      - name: Test
        shell: bash
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build --test-timeout 300
