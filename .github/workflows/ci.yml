name: Solvers CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: config.build.test
          - name: shared
            args: config.build.test.shared
          - name: sanitizer
            args: config.build.test.sanitizer
          - name: coverage
            args: config.build.test.coverage
          - name: ceres
            args: config.build.test.ceres
          - name: nlopt
            args: config.build.test.nlopt
          - name: ceres-nlopt
            args: config.build.test.ceres.nlopt
          - name: ceres-nlopt-benchmark
            args: config.build.test.ceres.nlopt.benchmark
          - name: gcc
            args: config.build.test.gcc
          - name: clangtidy
            args: config.build.clangtidy

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install clang-tidy
        if: matrix.name == 'clangtidy'
        run: sudo apt-get update && sudo apt-get install --yes clang-tidy

      - name: Configure, build, and test
        working-directory: Scripts
        run: python3 setup.py ${{ matrix.args }} --build-dir build-${{ matrix.name }}

  lint:
    name: Lint and format checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format clang-tidy
          python3 -m pip install --disable-pip-version-check \
            cmake-format==0.6.13 \
            cmakelint==1.4.1 \
            codespell[toml]==2.4.1 \
            editorconfig-checker==3.8.0

      - name: Check C++ formatting
        shell: bash
        run: |
          mapfile -d '' files < <(find include Testing -type f \( -name '*.h' -o -name '*.cpp' \) -print0)
          clang-format --dry-run --Werror "${files[@]}"

      - name: Check CMake formatting and lint
        shell: bash
        run: |
          mapfile -d '' files < <(find . -path './ThirdParty' -prune -o -path './build*' -prune -o -type f \( -name 'CMakeLists.txt' -o -name '*.cmake' -o -name '*.cmake.in' \) -print0)
          cmake-format --check "${files[@]}"
          cmakelint --config=.cmakelintrc "${files[@]}"

      - name: Check spelling
        shell: bash
        run: |
          mapfile -d '' files < <(find . \
            -path './.git' -prune \
            -o -path './ThirdParty' -prune \
            -o -path './build*' -prune \
            -o -type f -print0)
          codespell --toml .codespellrc "${files[@]}"

      - name: Check EditorConfig
        run: ec --exclude 'ThirdParty|build.*|\.git|\.DS_Store' .

      - name: Run clang-tidy
        shell: bash
        run: |
          cmake -S . -B build-lint -G Ninja \
            -DSOLVERS_ENABLE_TESTING=OFF \
            -DSOLVERS_ENABLE_CERES=OFF \
            -DSOLVERS_ENABLE_NLOPT=OFF \
            -DCMAKE_CXX_CLANG_TIDY=clang-tidy
          cmake --build build-lint --parallel 2
