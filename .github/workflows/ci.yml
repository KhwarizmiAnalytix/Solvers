name: Solvers CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: config.build.test
          - name: static
            args: config.build.test.static
          - name: sanitizer
            args: config.build.test.sanitizer
          - name: coverage
            args: config.build.test.coverage
          - name: ceres
            args: config.build.test.ceres
          - name: ipopt
            args: config.build.test.ipopt
          - name: petsc
            args: config.build.test.petsc
          - name: gcc
            args: config.build.test.gcc
          - name: clangtidy
            args: config.build.clangtidy

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install clang-tidy
        if: matrix.name == 'clangtidy'
        run: sudo apt-get update && sudo apt-get install --yes clang-tidy

      - name: Install coverage-tool
        if: matrix.name == 'coverage'
        run: pip install coverage-tool

      - name: Install Ipopt
        if: matrix.name == 'ipopt'
        run: sudo apt-get update && sudo apt-get install --yes coinor-libipopt-dev

      - name: Install PETSc
        if: matrix.name == 'petsc'
        run: sudo apt-get update && sudo apt-get install --yes petsc-dev libopenmpi-dev

      - name: Configure, build, and test
        working-directory: Scripts
        run: python3 setup.py ${{ matrix.args }}
