name: Solvers CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  # ===========================================================================
  # UBUNTU TESTS
  # ===========================================================================
  ubuntu-tests:
    name: Ubuntu - ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Core builds
          - name: default (Debug)
            args: config.build.test

          - name: static (Debug)
            args: config.build.test.static

          - name: default (Release)
            args: config.build.test.release

          - name: shared (Debug)
            args: config.build.test.shared

          # Compiler variants
          - name: GCC (Debug)
            args: config.build.test.gcc
            env_cc: gcc
            env_cxx: g++

          - name: Clang (Debug)
            args: config.build.test.clang
            env_cc: clang
            env_cxx: clang++

          # Backend variants
          - name: Ceres backend
            args: config.build.test.ceres

          - name: Ipopt backend
            args: config.build.test.ipopt

          - name: PETSc backend
            args: config.build.test.petsc

          # Multi-backend
          - name: Ceres + Ipopt
            args: config.build.test.ceres.ipopt

          - name: Ceres + PETSc
            args: config.build.test.ceres.petsc

          # Analysis
          - name: Sanitizer (UBSan + ASan)
            args: config.build.test.sanitizer

          - name: Coverage
            args: config.build.test.coverage

          - name: Clang-Tidy
            args: config.build.clangtidy

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            pkg-config \
            gfortran \
            liblapack-dev \
            libblas-dev \
            mold

      - name: Install Clang (for Clang variant)
        if: matrix.env_cc == 'clang'
        run: sudo apt-get install --yes clang

      - name: Install clang-tidy
        if: matrix.name == 'Clang-Tidy'
        run: sudo apt-get install --yes clang-tidy

      - name: Install coverage-tool
        if: matrix.name == 'Coverage'
        run: pip install coverage-tool

      - name: Install Ipopt
        if: contains(matrix.args, 'ipopt')
        run: sudo apt-get install --yes coinor-libipopt-dev

      - name: Install PETSc
        if: contains(matrix.args, 'petsc')
        run: sudo apt-get install --yes petsc-dev libopenmpi-dev

      - name: Configure, build, and test
        working-directory: Scripts
        env:
          CC: ${{ matrix.env_cc || '' }}
          CXX: ${{ matrix.env_cxx || '' }}
        run: python3 setup.py ${{ matrix.args }}

  # ===========================================================================
  # macOS TESTS
  # ===========================================================================
  macos-tests:
    name: macOS - ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 14 (Apple Silicon / ARM64)
          - name: default (Debug)
            os: macos-14
            args: config.build.test

          - name: static (Debug)
            os: macos-14
            args: config.build.test.static

          - name: shared (Debug)
            os: macos-14
            args: config.build.test.shared

          - name: Ceres backend
            os: macos-14
            args: config.build.test.ceres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install system dependencies
        run: |
          brew update
          brew install pkg-config openblas lapack

      - name: Install Ceres dependencies
        if: contains(matrix.args, 'ceres')
        run: |
          brew install glog gflags

      - name: Configure, build, and test
        working-directory: Scripts
        run: python3 setup.py ${{ matrix.args }}

  # ===========================================================================
  # WINDOWS TESTS
  # ===========================================================================
  windows-tests:
    name: Windows - ${{ matrix.name }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          # Core builds
          - name: default (Debug)
            args: config.build.test

          - name: static (Debug)
            args: config.build.test.static

          - name: default (Release)
            args: config.build.test.release

          - name: shared (Debug)
            args: config.build.test.shared

          # Backend variant
          - name: Ceres backend
            args: config.build.test.ceres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Configure, build, and test
        working-directory: Scripts
        shell: bash
        run: python3 setup.py ${{ matrix.args }}
