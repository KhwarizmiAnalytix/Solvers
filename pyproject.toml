# Tooling configuration for the Solvers build scripts. Referenced by the
# RUFF/PYFMT/CODESPELL linters in .lintrunner.toml (ruff reads [tool.ruff]; the
# pyfmt adapter passes this file via --config). Solvers itself is a C++/CMake
# project; this file exists for the Python tooling, not to package Solvers.

[project]
name = "solvers"
version = "1.0.0"
description = "Solvers: nonlinear least-squares and optimization backends (build tooling metadata)"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[tool.ruff]
line-length = 120
exclude = ["ThirdParty/**", "build/**", "build_*/**"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.ruff.lint]
# Keep E501 off to match .flake8 (line length is enforced by the formatter).
ignore = ["E501"]

[tool.usort.known]
first_party = ["helpers"]
standard_library = ["typing_extensions"]

[tool.codespell]
ignore-words = "Scripts/suppressions/spell_suppressions.txt"
